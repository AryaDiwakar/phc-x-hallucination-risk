services:
  phc-api:
    build: .
    image: phc-x:latest
    ports:
      - "8000:8000"
    environment:
      - PHC_HOST=0.0.0.0
      - PHC_PORT=8000
      - PHC_TELEMETRY=0
    volumes:
      - ./data:/app/data
      - ./results:/app/results
      - ./checkpoints:/app/checkpoints
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  dashboard:
    build: ./dashboard
    image: phc-x-dashboard:latest
    ports:
      - "5173:80"
    depends_on:
      - phc-api
    environment:
      - VITE_API_BASE=http://localhost:8000
