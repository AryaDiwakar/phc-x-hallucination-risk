services:
  phc-api:
    build: .
    image: phc-x:latest
    ports:
      - "8000:8000"
    environment:
      # PHCX_* are the variables the service actually reads.
      - PHCX_LOG=data/decision_log.jsonl
      - PHCX_RESULTS=results/raw
      - PHCX_POLICY=configs/policy.yaml
    volumes:
      - ./data:/app/data
      - ./results:/app/results
      - ./checkpoints:/app/checkpoints
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  # The dashboard is a static, build-free vanilla-JS app.  It is mounted by
  # the API process itself at /dashboard/, so there is no separate service
  # to build or run:
  #
  #   docker compose up --build
  #   open http://127.0.0.1:8000/dashboard/
