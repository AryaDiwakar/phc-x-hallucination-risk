# PHC-X training configuration
experiment: phcx_train_baseline
seed: 42
seeds: [42, 123, 2024]

dataset:
  name: phc-conversation
  path: data/processed/phc_conversation.jsonl
  split_strategy: family        # split by conversation family (no variant leakage)
  split_ratios: [0.7, 0.15, 0.15]   # train / val / test
  ab_split_by: source_question

features:
  mode: black_box               # black_box | white_box
  history_turns: 10
  use_prompt: true
  use_history: true
  use_provenance: true
  use_contradiction: true
  use_evidence: true
  use_temporal: true
  use_presupposition: true
  use_ambiguity: true
  use_whitebox: false           # only for white_box mode

model:
  name: rf                      # lr | rf | xgb | lgbm | mlp | neural
  hyperparameters:
    n_estimators: 300
    max_depth: 8
    min_samples_leaf: 5

calibration:
  # Platt (2 parameters) rather than isotonic: on a small, highly separable
  # calibration split sklearn's isotonic fit collapses to a 5-valued step
  # function, which pinned 30% of test rows at exactly 0.0 and reduced 161
  # distinct risk scores to 7 -- destroying the ranking and reporting a risk
  # of 0 for prompts with a detected unsupported presupposition.  A 2-parameter
  # monotone map cannot memorise the split and extrapolates smoothly.
  method: platt                 # none | platt | isotonic | temperature
  split: val                     # calibration must use validation split only

policy:
  optimize_thresholds: true
  cost_fp: 1.0
  cost_fn: 3.0
  abstention_cost: 2.0
  min_coverage: 0.50      # at least half of the turns must still be answered

evaluation:
  metrics: [auroc, auprc, f1, precision, recall, ece, brier, nll]
  bootstrap_rounds: 1000
  confidence: 0.95

output:
  checkpoint_dir: checkpoints
  results_dir: results/raw
