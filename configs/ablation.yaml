# PHC-X ablation study configuration (Section 20 / spec §20)
# The experiment name determines the output file
# (results/raw/ablation_<experiment>.json); `phc report` picks up
# `ablation_phcx_train_baseline.json`, so it must match.
experiment: phcx_train_baseline
seed: 42
seeds: [42, 123, 2024]
dataset:
  path: data/processed/phc_conversation.jsonl
  split_strategy: family
  split_ratios: [0.7, 0.15, 0.15]

model:
  name: rf
  hyperparameters: { n_estimators: 300, max_depth: 8, min_samples_leaf: 5 }

# Keep the calibrator in sync with configs/train.yaml so the ablation only
# varies the feature groups.
calibration: { method: platt }

# A: prompt only ... G: full + white-box
variants:
  - id: A_prompt_only
    use_prompt: true
    use_history: false
    use_provenance: false
    use_contradiction: false
    use_evidence: false
  - id: B_prompt_history
    use_prompt: true
    use_history: true
    use_provenance: false
    use_contradiction: false
    use_evidence: false
  - id: C_history_provenance
    use_prompt: true
    use_history: true
    use_provenance: true
    use_contradiction: false
    use_evidence: false
  - id: D_history_provenance_contradiction
    use_prompt: true
    use_history: true
    use_provenance: true
    use_contradiction: true
    use_evidence: false
  - id: E_history_provenance_evidence
    use_prompt: true
    use_history: true
    use_provenance: true
    use_contradiction: false
    use_evidence: true
  - id: F_full
    use_prompt: true
    use_history: true
    use_provenance: true
    use_contradiction: true
    use_evidence: true
  - id: G_full_whitebox
    use_prompt: true
    use_history: true
    use_provenance: true
    use_contradiction: true
    use_evidence: true
    use_whitebox: true
    requires: white_box

output: results/raw/ablation
