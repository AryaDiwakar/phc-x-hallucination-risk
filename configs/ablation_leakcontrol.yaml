experiment: phcx_leakcontrol
seed: 42
seeds:
- 42
- 123
- 2024
dataset:
  path: data/phc_conversation_leakcontrol
  split_strategy: family
  split_ratios:
  - 0.7
  - 0.15
  - 0.15
model:
  name: xgb
  hyperparameters:
    n_estimators: 300
    max_depth: 4
