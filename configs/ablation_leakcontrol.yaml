  use_history: false
  use_provenance: false
  use_contradiction: false
  use_evidence: false
- id: B_prompt_history
  use_prompt: true
  use_history: true
  use_provenance: false
  use_contradiction: false
  use_evidence: false
- id: C_history_provenance
  use_prompt: true
  use_history: true
  use_provenance: true
  use_contradiction: false
  use_evidence: false
- id: D_history_provenance_contradiction
  use_prompt: true
  use_history: true
  use_provenance: true
  use_contradiction: true
  use_evidence: false
- id: E_history_provenance_evidence
  use_prompt: true
  use_history: true
  use_provenance: true
  use_contradiction: false
  use_evidence: true
- id: F_full
  use_prompt: true
  use_history: true
  use_provenance: true
  use_contradiction: true
  use_evidence: true
- id: G_full_whitebox
  use_prompt: true
  use_history: true
